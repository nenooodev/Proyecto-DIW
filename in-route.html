<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>Proyecto DIW | In Route</title>
        <link rel="stylesheet" href="css/main.css" />
    </head>
    <body>
        <header class="header">
            <aside class="route-indicator">
                <h1 class="indicator__next-checkpoint">Next checkpoint</h1>
                <div>
                    <div class="indication__icon"></div>
                    <p class="indication__distance">1km</p>
                </div>
            </aside>
        </header>
        <main class="map"></main>
        <footer class="footer">
            <aside class="route-info">
                <a href="start-route.html" class="circle__button">
                    <div class="cross__icon"></div>
                </a>
                <div class="info">
                    <p class="info--time-left"></p>
                    <div class="info--bottom__info">
                        <p class="speed"></p>
                        <p class="arrival-hour"></p>
                    </div>
                </div>
            </aside>
        </footer>
    </body>
</html>
