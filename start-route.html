<!doctype html>
<html lang="es">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>Proyecto DIW | Start Route</title>
        <link rel="stylesheet" href="css/main.css" />
    </head>
    <body>
        <header class="header">
            <a class="search__back-button" href="index.html"></a>
            <div class="search">
                <div class="search__icon" aria-hidden="true"></div>

            <form class="route__form">
                <label class="route__field">
                    <span class="origin__icon" aria-hidden="true"></span>

                <label class="route__field">
                    <span class="destination__icon" aria-hidden="true"></span>
                    <input class="input" type="text" placeholder="Destino" />

            </form>
        </header>
        <main class="map"></main>
        <footer>
            <a class="button--cta" href="start-route.html">
                <div class="go__icon" aria-hidden="true"></div>

            </a>
            <a class="button">
                <div class="info__icon" aria-hidden="true"></div>

            </a>
